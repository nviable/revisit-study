name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Deploy Worker (production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: yarn

      - name: Upload Worker preview version (PR / non-main)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Upload a version with a stable branch preview alias; does not promote production.
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number || github.run_id }}
          packageManager: yarn

      - name: Comment preview URL on PR
        if: >-
          github.event_name == 'pull_request' &&
          (steps.preview.outputs.deployment-url || steps.preview.outputs.command-output)
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const commandOutput = process.env.COMMAND_OUTPUT || '';
            const previewMatch = commandOutput.match(/https:\/\/[^\s]+workers\.dev[^\s]*/);
            const url = deploymentUrl || (previewMatch && previewMatch[0]) || null;
            if (!url) {
              core.warning('No Cloudflare preview URL found in wrangler output');
              return;
            }
            const body = [
              '### Cloudflare Workers preview',
              '',
              `Preview: ${url}`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('Cloudflare Workers preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
